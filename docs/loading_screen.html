<style>
html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 40%,#3a2a6e,#140d2b);font-family:system-ui,sans-serif;overflow:hidden}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.stage{position:relative;width:240px;height:236px}
.logo{position:absolute;left:20px;top:34px;width:200px;animation:bounce 1.2s cubic-bezier(.5,0,.5,1) infinite;transform-origin:50% 100%}
@keyframes bounce{0%,100%{transform:translateY(0) scale(1.06,.94)}15%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-34px) scale(.97,1.03) rotate(-3deg)}85%{transform:translateY(0) scale(1,1)}}
.shadow{position:absolute;left:60px;bottom:-2px;width:120px;height:16px;border-radius:50%;background:rgba(0,0,0,.45);filter:blur(4px);animation:sh 1.2s cubic-bezier(.5,0,.5,1) infinite}
@keyframes sh{50%{transform:scale(.7);opacity:.5}}
.pop{position:absolute;left:115px;top:150px;width:16px;height:14px;border-radius:50% 45% 50% 40%;background:radial-gradient(circle at 35% 35%,#fff9d6,#f7d35a);box-shadow:5px 3px 0 -1px #fbe38a,-4px 4px 0 -2px #fff3b8;opacity:0;animation:pop 1.8s ease-out infinite}
@keyframes pop{0%{opacity:0;transform:translate(0,0) scale(.3)}10%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(1)}}
.txt{margin-top:18px;color:#f3e9ff;font-weight:600;letter-spacing:.08em}
.txt span{display:inline-block;animation:dot 1.2s infinite}.txt span:nth-child(2){animation-delay:.15s}.txt span:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{transform:none;opacity:.4}30%{transform:translateY(-5px);opacity:1}}
.brand{text-align:center;margin-top:0;animation:fade 1s ease-out both .2s;perspective:400px}
.brand .by{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.35em;text-transform:uppercase;color:rgba(243,233,255,.6)}
.brand .name{font-family:'Fredoka',system-ui,sans-serif;font-weight:700;font-size:44px;line-height:1;margin:6px 0 8px;color:#fffaf0;
text-shadow:0 1px 0 #ffd1d6,0 2px 0 #ff9aa6,0 3px 0 #ff7a8a,0 4px 0 #f25a6c,0 5px 0 #e2475a,0 6px 0 #cf3449,0 7px 0 #b8263b,0 8px 0 #9e1c30,
0 9px 2px rgba(0,0,0,.4),0 14px 12px rgba(0,0,0,.45),0 0 28px rgba(255,110,140,.35);
animation:tilt 4s ease-in-out infinite;transform-style:preserve-3d}
.brand .name b{color:#ffe27a;font-weight:700}
.brand .since{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.5em;color:rgba(243,233,255,.45)}
.brand .since:before,.brand .since:after{content:"";display:inline-block;width:26px;height:1px;background:rgba(243,233,255,.3);vertical-align:middle;margin:0 10px}
@keyframes tilt{0%,100%{transform:rotateX(12deg) rotateY(-8deg)}50%{transform:rotateX(12deg) rotateY(8deg) translateY(-3px)}}
@keyframes fade{from{opacity:0;transform:translateY(10px)}}
