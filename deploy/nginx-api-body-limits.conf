# Per-route request-body limits for the API (security audit 2026-11-19, finding 1). NOT applied on the server yet: needs the owner's review.
#
# Problem: the existing server block has `client_max_body_size 1100m` for EVERYTHING and Nginx buffers a whole request body to disk before the
# app sees a single header, so anyone could send gigabytes to /api/auth/login (memory) or POST /api/jobs without an account (disk).
# The backend now has its own guard (backend/guard.py: 401 before the body on upload routes, per-route limits). This file makes Nginx do the same
# cheaply and, for the upload routes, STOP BUFFERING so the app's 401 / 413 arrives before the body has been stored.
#
# How to apply (on the server, as root):
#  1. Create /etc/nginx/snippets/recap-api-proxy.conf with the proxy settings the current `location /api/` block already has:
#         proxy_pass http://127.0.0.1:8010;
#         proxy_http_version 1.1;
#         proxy_set_header Host $host;
#         proxy_set_header X-Real-IP $remote_addr;
#         proxy_set_header X-Forwarded-For $remote_addr;
#         proxy_set_header X-Forwarded-Proto $scheme;
#         proxy_read_timeout 600s;
#         proxy_send_timeout 600s;
#  2. In /etc/nginx/sites-available/movie-recap (and recap-admin, which proxies the same API) REPLACE the existing `location /api/ { ... }`
#     block with the locations below. Keep the rest. Back the file up first.
#  3. `nginx -t`, then `systemctl reload nginx`. Check: an unauthenticated POST of a small file to /api/jobs answers 401 and a normal login works.
#
# Order matters little: `=` and the regex beat the prefixes, and /api/auth/ is longer than /api/. Limits are a coarse first line; the app enforces
# the exact ones (guard.py RULES).

location /api/ {                      # everything else: the largest JSON body is a re-render of 600 lines; the top-up slip is 10 MB
    client_max_body_size 12m;
    include snippets/recap-api-proxy.conf;
}

location /api/auth/ {                 # login / register / me: tiny JSON
    client_max_body_size 64k;
    include snippets/recap-api-proxy.conf;
}

location = /api/jobs {                # the video upload (MAX_UPLOAD_MB 1024 + logo + fields)
    client_max_body_size 1100m;
    proxy_request_buffering off;      # pass the body on as it arrives: the app answers 401 / 413 first and nothing is stored in Nginx's temp folder
    include snippets/recap-api-proxy.conf;
}

location ~ ^/api/jobs/[^/]+/device-video$ {   # the finished video of an on-device render (DEVICE_VIDEO_MAX_MB 600)
    client_max_body_size 610m;
    proxy_request_buffering off;
    include snippets/recap-api-proxy.conf;
}
