# Include inside the existing movie-recap HTTPS server block. These locations
# complement its existing /api/, /ort/, /separate-test.html, and / handlers.
# Vite gives files under /assets/ content-hashed names; missing assets must not
# fall back to index.html or be cached as successful JavaScript responses.
# Deployments must retain previous hashed assets while old pages are open;
# do not rsync --delete the assets directory on every deployment.
location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

location = /index.html {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Report-only until the complete app and Android WebView have been checked.
    # This header applies to the website HTML, not to the bundled native app.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https:; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
}
